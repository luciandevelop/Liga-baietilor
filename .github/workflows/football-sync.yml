name: Sincronizare API-Football (live)

"on":
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Apel catre functia Vercel
        run: |
          curl -sf -X POST "https://liga-baietilor.vercel.app/api/football-sync" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
