name: Actualizeaza manifestul de avataruri

"on":
  push:
    branches:
      - main
    paths:
      - public/avatars/**

permissions:
  contents: write

jobs:
  update-manifest:
    runs-on: ubuntu-latest
    steps:
      - name: Cloneaza repo-ul
        uses: actions/checkout@v4

      - name: Pregateste Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Regenereaza manifestul de avataruri
        run: node scripts/generate-avatar-manifest.js

      - name: Comite manifestul daca s-a schimbat
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: actualizeaza manifestul de avataruri"
          file_pattern: src/assets/avatarManifest.generated.js
