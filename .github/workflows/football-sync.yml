name: Sincronizare API-Football (live)

"on":
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Apel catre functia Vercel
        run: |
          curl -s -o /tmp/response.txt -w "HTTP STATUS: %{http_code}\n" -X POST "https://baietilor.vercel.app/api/football-sync" -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"
          cat /tmp/response.txt
